<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #050508;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(69,61,200,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .glow2 {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(130,122,255,0.08) 0%, transparent 70%);
    }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 80px;
      width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(180,180,200,0.8);
      margin-bottom: 28px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 64px;
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      max-width: 820px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #827AFF 50%, #453DC8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 20px;
      color: rgba(180,180,200,0.65);
      line-height: 1.5;
      max-width: 640px;
      margin-bottom: 36px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(180,180,200,0.5);
      font-family: monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .meta-sep {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.1);
    }

    .brand {
      position: absolute;
      bottom: 40px;
      right: 60px;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: -0.01em;
    }

    .border-accent {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, transparent, #453DC8, #827AFF, transparent);
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="border-accent"></div>

  <div class="content">
    <div class="badge">
      <span class="dot"></span>
      MRP Employment Agency
    </div>

    <h1>
      Your next job<br />
      should be in AI.<br />
      <span class="gradient-text">We'll get you there.</span>
    </h1>

    <p>
      A highly selective 6-month career partnership. Resume, LinkedIn,
      interview prep, and daily applications — all done with you.
    </p>

    <div class="meta-row">
      <div class="meta-item">$10,000</div>
      <div class="meta-sep"></div>
      <div class="meta-item">6 Months</div>
      <div class="meta-sep"></div>
      <div class="meta-item">EMI Available</div>
      <div class="meta-sep"></div>
      <div class="meta-item">Free Consultation</div>
    </div>
  </div>

  <div class="brand">MyRealProduct</div>
</body>
</html>
